<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Demo Video — Syed Wajeeh Ul Hassan</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
    <rect width="1080" height="1920" fill="#0a0a0a"/>
    <rect x="300" y="300" width="480" height="1320" rx="60" fill="#10231f"/>
    <text x="540" y="980" font-family="monospace" font-size="200" font-weight="bold" fill="#1a9e8f" text-anchor="middle">SWH</text>
    <circle cx="760" cy="380" r="22" fill="#e8a33d"/>
  </svg>
</template>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
  #root { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  @keyframes abfade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script type="text/babel" src="../animations.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>
<script type="text/babel">
const DURATION = 15.2;

// keeps data-screen-label on #root in sync with the playhead (for review)
function TimeLabel() {
  const t = useTime();
  React.useEffect(() => {
    const el = document.getElementById('root');
    if (el) el.setAttribute('data-screen-label', 'video @ ' + t.toFixed(1) + 's');
  }, [Math.floor(t)]);
  return null;
}

function Video() {
  return (
    <Stage width={1080} height={1920} duration={DURATION} background={BG} persistKey="swh-demo">
      <TimeLabel />
      <Sprite start={0} end={2.85}>{() => <HookScene />}</Sprite>
      <Sprite start={2.6} end={12.95}>{() => <DeviceSpan />}</Sprite>
      <Captions />
      <Sprite start={12.8} end={15.2}>{() => <CtaScene />}</Sprite>
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Video />);
</script>
</body>
</html>
