<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Industries — Syed Wajeeh Ul Hassan</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"/>
<noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/></noscript>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: oklch(98.5% 0.008 60); --bg2: oklch(96% 0.012 60);
  --fg: oklch(18% 0.02 240); --fg2: oklch(42% 0.02 240); --fg3: oklch(62% 0.015 240);
  --teal: oklch(52% 0.14 195); --teal-light: oklch(94% 0.04 195); --teal-dim: oklch(52% 0.14 195 / 0.12);
  --amber: oklch(68% 0.14 65); --amber-light: oklch(95% 0.04 65);
  --border: oklch(88% 0.01 60); --mono: 'JetBrains Mono', monospace; --sans: 'Plus Jakarta Sans', sans-serif;
  --radius: 12px; --shadow: 0 2px 16px oklch(18% 0.02 240 / 0.08); --shadow-lg: 0 8px 40px oklch(18% 0.02 240 / 0.12);
}
body.dark { --bg: oklch(14% 0.015 240); --bg2: oklch(18% 0.015 240); --fg: oklch(92% 0.008 60); --fg2: oklch(70% 0.008 60); --fg3: oklch(50% 0.008 60); --border: oklch(28% 0.015 240); --teal-light: oklch(30% 0.06 195); --teal-dim: oklch(52% 0.14 195 / 0.2); --amber-light: oklch(28% 0.06 65); }
body.dark nav { background: oklch(14% 0.015 240 / 0.92); }
body.dark .svc-card, body.dark .kw-card, body.dark .nav-dropdown { background: oklch(20% 0.015 240); }
body.dark .page-header { background: linear-gradient(135deg, oklch(14% 0.015 240) 0%, oklch(16% 0.03 195) 50%, oklch(14% 0.015 240) 100%); }
html { scroll-behavior: smooth; }
body { font-family: var(--sans); background: var(--bg); color: var(--fg); line-height: 1.6; transition: background 0.3s, color 0.3s; }
::selection { background: var(--teal-dim); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
@keyframes navSlideDown { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: translateY(0); } }
@keyframes gradientShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: oklch(98.5% 0.008 60 / 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 5%; height: 72px; display: flex; align-items: center; justify-content: space-between; animation: navSlideDown 0.6s ease forwards; }
.nav-logo { display: flex; align-items: center; text-decoration: none; }
.nav-links { display: flex; gap: 4px; list-style: none; align-items: center; }
.nav-links > li { position: relative; }
.nav-links a { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--fg2); text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px; }
.nav-links a:hover, .nav-links a.active { color: var(--teal); background: var(--teal-light); }
.nav-cta { background: var(--teal) !important; color: white !important; padding: 9px 20px !important; border-radius: 10px !important; font-weight: 600 !important; }
.nav-cta:hover { background: oklch(46% 0.14 195) !important; transform: translateY(-2px); }
.dark-toggle { width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.2s; flex-shrink: 0; margin-left: 10px; }
.dark-toggle:hover { background: var(--teal-light); border-color: var(--teal); transform: rotate(15deg); }

.has-dropdown > a::after { content: '▾'; font-size: 10px; opacity: 0.7; }
.nav-dropdown {
  position: absolute; top: calc(100% + 4px); left: -8px;
  background: white; border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow-lg); padding: 10px;
  min-width: 320px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity 0.18s, visibility 0.18s, transform 0.18s;
}
.has-dropdown:hover .nav-dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
.nav-dropdown a {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 10px 12px; border-radius: 8px;
  font-family: var(--sans) !important; font-size: 13px !important; font-weight: 600;
  color: var(--fg) !important;
}
.nav-dropdown a:hover { background: var(--teal-light); }
.nav-dropdown a small { font-family: var(--mono); font-size: 10px; font-weight: 500; color: var(--fg3); }

.page-header { padding: 120px 5% 60px; background: linear-gradient(135deg, var(--bg) 0%, oklch(97% 0.018 195) 50%, var(--bg) 100%); background-size: 400% 400%; animation: gradientShift 12s ease infinite; position: relative; overflow: hidden; }
.page-header-bg { position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 48px 48px; opacity: 0.35; pointer-events: none; }
.page-header-inner { max-width: 900px; margin: 0 auto; animation: fadeUp 0.7s ease forwards; position: relative; }
.svc-eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--teal); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.svc-eyebrow .ico { width: 38px; height: 38px; border-radius: 10px; background: var(--teal-light); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
.page-header h1 { font-family: var(--mono); font-size: clamp(30px, 4.4vw, 52px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 16px; }
.page-header h1 span { color: var(--teal); }
.page-header .lead { font-size: 17px; color: var(--fg2); max-width: 640px; line-height: 1.7; }
.bread { display: flex; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--fg3); margin-bottom: 18px; }
.bread a { color: var(--teal); text-decoration: none; }
.bread span { opacity: 0.5; }

.layout { max-width: 1100px; margin: 0 auto; padding: 48px 5% 80px; }
.svc-section { margin-bottom: 56px; }
.svc-h2 { font-family: var(--mono); font-size: clamp(22px, 2.4vw, 28px); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; color: var(--fg); }
.svc-h2-lbl { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--teal); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
.svc-h2 + p { font-size: 15px; color: var(--fg2); margin-bottom: 28px; max-width: 760px; line-height: 1.75; }

.svc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.svc-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; transition: all 0.2s; }
.svc-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--teal-dim); }
.svc-card .num { font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--teal); margin-bottom: 8px; }
.svc-card h4 { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--fg); margin-bottom: 8px; letter-spacing: -0.01em; }
.svc-card p { font-size: 13px; color: var(--fg2); line-height: 1.65; }

.kr-flow { display: flex; flex-direction: column; gap: 14px; position: relative; }
.kr-flow::before { content: ''; position: absolute; left: 27px; top: 28px; bottom: 28px; width: 2px; background: linear-gradient(to bottom, var(--teal) 0%, var(--teal-dim) 100%); border-radius: 2px; }
.kr-step { display: flex; gap: 20px; align-items: flex-start; position: relative; }
.kr-num { flex-shrink: 0; width: 56px; height: 56px; border-radius: 14px; background: var(--teal); color: white; font-family: var(--mono); font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; z-index: 2; box-shadow: 0 4px 16px var(--teal-dim); }
.kr-body { background: white; border: 1px solid var(--border); border-radius: var(--radius); padding: 22px 26px; flex: 1; transition: all 0.2s; }
.kr-body:hover { transform: translateX(4px); box-shadow: var(--shadow); border-color: var(--teal-dim); }
body.dark .kr-body { background: oklch(20% 0.015 240); }
.kr-body h4 { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--fg); margin-bottom: 8px; letter-spacing: -0.01em; }
.kr-body p { font-size: 14px; color: var(--fg2); line-height: 1.7; margin-bottom: 12px; }
.kr-tools { display: flex; flex-wrap: wrap; gap: 6px; }
.kr-tools span { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--teal); background: var(--teal-light); padding: 4px 9px; border-radius: 999px; letter-spacing: 0.02em; }
@media (max-width: 640px) {
  .kr-flow::before { left: 19px; }
  .kr-num { width: 40px; height: 40px; font-size: 12px; border-radius: 10px; }
  .kr-body { padding: 16px 18px; }
}

.kw-table { background: white; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
body.dark .kw-table { background: oklch(20% 0.015 240); }
.kw-header { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; padding: 14px 22px; background: var(--bg2); border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: 0.06em; }
.kw-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 12px; padding: 14px 22px; border-bottom: 1px solid var(--border); align-items: center; transition: background 0.15s; }
.kw-row:last-child { border-bottom: none; }
.kw-row:hover { background: var(--bg2); }
.kw-row .kw { font-family: var(--mono); font-size: 13px; color: var(--fg); font-weight: 600; }
.kw-row .vol { font-family: var(--mono); font-size: 13px; color: var(--teal); font-weight: 700; }
.kw-row .diff { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 999px; display: inline-block; width: fit-content; }
.kw-row .diff.low { background: oklch(92% 0.05 145); color: oklch(40% 0.12 145); }
.kw-row .diff.med { background: var(--amber-light); color: var(--amber); }
.kw-row .diff.high { background: oklch(94% 0.06 25); color: oklch(50% 0.18 25); }
body.dark .kw-row .diff.low { background: oklch(28% 0.06 145); color: oklch(75% 0.12 145); }
body.dark .kw-row .diff.high { background: oklch(28% 0.08 25); color: oklch(80% 0.15 25); }
.kw-row .intent { font-family: var(--mono); font-size: 11px; color: var(--fg3); font-weight: 500; }

.deliv-list { display: flex; flex-direction: column; gap: 10px; }
.deliv-item { display: flex; gap: 14px; padding: 16px 20px; background: var(--bg2); border-radius: 10px; border-left: 3px solid var(--teal); }
.deliv-item .chk { color: var(--teal); flex-shrink: 0; font-weight: 700; font-size: 16px; }
.deliv-item .txt { font-size: 14px; color: var(--fg); line-height: 1.6; }

.cta-band { background: var(--fg); color: white; border-radius: 16px; padding: 40px; display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-top: 48px; flex-wrap: wrap; }
.cta-band h3 { font-family: var(--mono); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.cta-band p { color: oklch(75% 0.01 60); font-size: 14px; margin-top: 6px; }
.cta-band .btn { background: var(--teal); color: white; font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 14px 28px; border-radius: 10px; text-decoration: none; transition: all 0.2s; white-space: nowrap; }
.cta-band .btn:hover { background: oklch(46% 0.14 195); transform: translateY(-2px); }

.svc-pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 32px; padding-top: 28px; border-top: 1px solid var(--border); }
.pager-link { display: flex; flex-direction: column; gap: 4px; padding: 14px 20px; background: var(--bg2); border-radius: 10px; text-decoration: none; transition: all 0.2s; flex: 1; max-width: 260px; }
.pager-link:hover { background: var(--teal-light); transform: translateY(-2px); }
.pager-link.next { text-align: right; align-items: flex-end; }
.related-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.related-card { display: flex; align-items: center; gap: 14px; padding: 18px; background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; text-decoration: none; transition: transform .2s, box-shadow .2s, border-color .2s; }
.related-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--teal-dim); }
.related-ico { flex-shrink: 0; width: 44px; height: 44px; border-radius: 11px; background: var(--teal-light); display: flex; align-items: center; justify-content: center; font-size: 22px; }
.related-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.related-info b { font-family: var(--mono); font-size: 14px; font-weight: 700; color: var(--fg); letter-spacing: -0.01em; }
.related-info small { font-size: 12px; color: var(--fg2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.related-go { margin-left: auto; flex-shrink: 0; font-family: var(--mono); color: var(--teal); font-weight: 700; transition: transform .15s; }
.related-card:hover .related-go { transform: translateX(3px); }
.pager-link small { font-family: var(--mono); font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: 0.1em; }
.pager-link span { font-family: var(--mono); font-size: 14px; color: var(--teal); font-weight: 600; }

/* HUB GRID */
.hub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.hub-card {
  background: white; border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px; text-decoration: none; color: inherit;
  display: flex; flex-direction: column; gap: 10px;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  position: relative; overflow: hidden;
  animation: fadeUp 0.5s ease forwards; opacity: 0;
}
body.dark .hub-card { background: oklch(20% 0.015 240); }
.hub-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--teal), var(--amber));
  transform: scaleX(0); transform-origin: left; transition: transform 0.3s;
}
.hub-card:hover::before { transform: scaleX(1); }
.hub-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--teal-dim); }
.hub-card-icon {
  width: 48px; height: 48px; border-radius: 12px;
  background: var(--teal-light); color: var(--teal);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; margin-bottom: 8px;
}
.hub-card h3 {
  font-family: var(--mono); font-size: 16px; font-weight: 700;
  color: var(--fg); letter-spacing: -0.01em;
}
.hub-card .short {
  font-family: var(--mono); font-size: 11px; color: var(--teal);
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
}
.hub-card p { font-size: 13px; color: var(--fg2); line-height: 1.7; }
.hub-card .arrow {
  font-family: var(--mono); font-size: 12px; color: var(--teal);
  font-weight: 700; margin-top: auto; padding-top: 8px;
}

footer { background: var(--fg); color: oklch(85% 0.01 60); padding: 32px 5%; text-align: center; margin-top: 0; }
.footer-back { display: inline-flex; align-items: center; gap: 6px; color: var(--teal); font-family: var(--mono); font-size: 13px; text-decoration: none; margin-bottom: 12px; }
.footer-copy { font-size: 13px; color: oklch(50% 0.01 60); }

@media (max-width: 820px) {
  .nav-links { display: none; }
  .nav-hamburger { display: flex !important; }
  .nav-links.open { display: flex !important; flex-direction: column; align-items: stretch; position: absolute; top: 100%; left: 0; right: 0; background: var(--bg); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-lg); padding: 10px 5% 16px; gap: 2px; max-height: calc(100vh - 64px); overflow-y: auto; z-index: 99; }
  .nav-links.open > li { width: 100%; }
  .nav-links.open > li > a { display: block; padding: 13px 14px; border-radius: 10px; font-size: 15px; }
  /* Mobile services submenu: accordion toggled by the caret button */
  .nav-links.open .has-dropdown { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 4px; }
  .nav-links.open .has-dropdown > a { grid-column: 1; }
  .nav-links.open .has-dropdown > a::after { display: none; }
  .nav-links.open .has-dropdown > .dropdown-caret { display: inline-flex; grid-column: 2; }
  .nav-links.open .has-dropdown > .nav-dropdown { grid-column: 1 / -1; }
  .nav-links.open .has-dropdown.submenu-open .dropdown-caret { transform: rotate(180deg); color: var(--teal); }
  .nav-links.open .nav-dropdown { position: static; opacity: 0; visibility: hidden; max-height: 0; overflow: hidden; transform: none; box-shadow: none; border: none; background: transparent; padding: 0; min-width: 0; grid-template-columns: 1fr; gap: 2px; transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.2s ease; }
  .nav-links.open .has-dropdown.submenu-open .nav-dropdown { opacity: 1; visibility: visible; max-height: 800px; padding: 4px 0 8px 12px; }
  .nav-links.open .nav-cta { width: 100% !important; text-align: center; justify-content: center; margin-top: 6px; }
  .kw-header, .kw-row { grid-template-columns: 1.5fr 1fr 1fr; }
  .kw-header .col-intent, .kw-row .intent { display: none; }
  .cta-band { padding: 28px; flex-direction: column; align-items: flex-start; }
}

/* ─── ESTIMATOR ─────────────────────────────────────────── */
.est-section { scroll-margin-top: 90px; }
.est-card { display: grid; grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr); gap: 20px; align-items: start; }
.est-form, .est-result { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
body.dark .est-form, body.dark .est-result { background: oklch(20% 0.015 240); }
.est-field { margin-bottom: 16px; }
.est-label { display: block; font-family: var(--mono); font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--fg); margin-bottom: 7px; }
.est-input { width: 100%; font-family: var(--sans); font-size: 14px; color: var(--fg); background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 11px 13px; outline: none; transition: border-color .15s, box-shadow .15s; }
.est-input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-dim); }
.est-hint { font-size: 12px; color: var(--fg2); margin-top: 5px; line-height: 1.5; }
.est-budget { display: flex; align-items: stretch; gap: 0; background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 0; overflow: hidden; transition: border-color .15s, box-shadow .15s; }
.est-budget:focus-within { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-dim); }
.est-budget span { display: flex; align-items: center; padding: 0 13px; background: var(--bg2); border-right: 1.5px solid var(--border); font-family: var(--mono); font-weight: 700; color: var(--fg2); }
.est-budget:focus-within span { border-right-color: var(--teal); color: var(--teal); }
.est-budget .est-input { border: none; background: none; padding: 11px 13px; border-radius: 0; }
.est-rangewrap { display: flex; align-items: center; gap: 14px; }
.est-range { flex: 1; -webkit-appearance: none; appearance: none; height: 5px; border-radius: 5px; background: var(--border); outline: none; }
.est-range::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--teal); cursor: pointer; border: 3px solid white; box-shadow: var(--shadow); }
.est-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--teal); cursor: pointer; border: 3px solid white; }
.est-rangeval { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--teal); min-width: 28px; text-align: center; }
.est-checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.est-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg); cursor: pointer; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 9px; transition: .15s; }
.est-check:hover { border-color: var(--teal-dim); }
.est-check input { accent-color: var(--teal); width: 15px; height: 15px; cursor: pointer; }
.est-check:has(input:checked) { border-color: var(--teal); background: var(--teal-light); }
.est-run { width: 100%; margin-top: 6px; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.02em; background: var(--teal); color: white; border: none; border-radius: 10px; padding: 13px; cursor: pointer; transition: background .15s, transform .1s; }
.est-run:hover { background: oklch(46% 0.14 195); }
.est-run:active { transform: translateY(1px); }

<!-- HEADER -->
<div class="page-header">
  <div class="page-header-bg"></div>
  <div class="page-header-inner">
    <div class="bread" id="bread"></div>
    <div class="svc-eyebrow"><span class="ico" id="svc-ico">🏭</span><span id="svc-eyebrow-text">Industry</span></div>
    <h1 id="svc-title">Industries</h1>
    <p class="lead" id="svc-lead"></p>
  </div>
</div>

<!-- BODY -->
<div class="layout" id="svc-body"></div>

<!-- FOOTER -->
<footer>
  <div><a href="index.html" class="footer-back">← Back to Portfolio</a></div>
  <p class="footer-copy">© 2026 Syed Wajeeh Ul Hassan · Lahore, Pakistan</p>
</footer>

<script src="services-data.js"></script>
<script src="industries-data.js"></script>
<script>
// ─── NAV DROPDOWNS ─────────────────────────────────────────────
function renderSvcDropdown() {
  const dd = document.getElementById('nav-dropdown');
  if (!dd || !window.SERVICES) return;
  dd.innerHTML = SERVICE_ORDER.map(k => {
    const s = SERVICES[k];
    return `<a href="services.html?s=${k}"><span>${s.icon} ${s.title}</span><small>${s.short}</small></a>`;
  }).join('');
}
function renderIndDropdown() {
  const dd = document.getElementById('ind-dropdown');
  if (!dd) return;
  dd.innerHTML = INDUSTRY_ORDER.map(k => {
    const s = INDUSTRIES[k];
    return `<a href="industries.html?i=${k}"><span>${s.icon} ${s.short}</span><small>${s.lead.split(' ').slice(0, 6).join(' ')}…</small></a>`;
  }).join('');
}

// ─── HUB (no param) ────────────────────────────────────────────
function renderHub() {
  document.getElementById('svc-ico').textContent = '🏭';
  document.getElementById('svc-eyebrow-text').textContent = 'Industries · Pick your market';
  document.getElementById('svc-title').innerHTML = 'Eight markets, <span>one</span> operating system';
  document.getElementById('svc-lead').textContent = "Growth playbooks change shape by industry — the funnel, the buyer, the compliance rules, the metric that matters. Pick your market to see exactly how I approach it.";
  document.title = 'Industries — Syed Wajeeh Ul Hassan';
  document.getElementById('bread').innerHTML = `<a href="index.html">Home</a><span>/</span>Industries`;

  const body = document.getElementById('svc-body');
  body.innerHTML = `
    <div class="svc-section">
      <div class="svc-h2-lbl">All Industries</div>
      <h2 class="svc-h2">Where I've already done the homework</h2>
      <p>Each industry page covers the market realities, my approach step by step, and the channels that pull the most weight. Hover over <strong>Industries</strong> in the nav to jump between them.</p>
      <div class="hub-grid">
        ${INDUSTRY_ORDER.map((k, i) => {
          const s = INDUSTRIES[k];
          return `<a class="hub-card" href="industries.html?i=${k}" style="animation-delay:${i*0.05}s;">
            <div class="hub-card-icon">${s.icon}</div>
            <div class="short">${s.short}</div>
            <h3>${s.title}</h3>
            <p>${s.lead.split('.')[0]}.</p>
            <div class="arrow">See the approach →</div>
          </a>`;
        }).join('')}
      </div>
    </div>

    <div class="cta-band">
      <div>
        <h3>Don't see your industry?</h3>
        <p>The playbook adapts. Tell me about your market and I'll show you how it applies.</p>
      </div>
      <a class="btn" href="contact.html">Start a Conversation →</a>
    </div>
  `;
  window.scrollTo(0, 0);
}

// ─── INDUSTRY DETAIL ───────────────────────────────────────────
function renderIndustry(key) {
  const s = INDUSTRIES[key];
  if (!s) return renderHub();

  const idx = INDUSTRY_ORDER.indexOf(key);
  const prevKey = INDUSTRY_ORDER[(idx - 1 + INDUSTRY_ORDER.length) % INDUSTRY_ORDER.length];
  const nextKey = INDUSTRY_ORDER[(idx + 1) % INDUSTRY_ORDER.length];

  document.getElementById('svc-ico').textContent = s.icon;
  document.getElementById('svc-eyebrow-text').textContent = s.eyebrow;
  document.getElementById('svc-title').innerHTML = s.title.replace(/^([\w-]+)/, '<span>$1</span>');
  document.getElementById('svc-lead').textContent = s.lead;
  document.title = `${s.title} — Syed Wajeeh Ul Hassan`;
  document.getElementById('bread').innerHTML = `<a href="index.html">Home</a><span>/</span><a href="industries.html">Industries</a><span>/</span>${s.short}`;

  const hasServices = !!window.SERVICES;
  const related = hasServices ? s.services.filter(k => SERVICES[k]) : [];

  const body = document.getElementById('svc-body');
  body.innerHTML = `
    <div class="svc-section">
      <div class="svc-h2-lbl">The Market</div>
      <h2 class="svc-h2">What actually matters in ${s.short}</h2>
      <p>Every industry has funnel realities that decide whether marketing pays. In ${s.short}, these four shape everything I build:</p>
      <div class="svc-grid">
        ${s.realities.map(([num, t, p]) => `
          <div class="svc-card">
            <div class="num">${num}</div>
            <h4>${t}</h4>
            <p>${p}</p>
          </div>`).join('')}
      </div>
    </div>

    <div class="svc-section">
      <div class="svc-h2-lbl">My Approach</div>
      <h2 class="svc-h2">${s.approach.title}</h2>
      <p>${s.approach.intro}</p>
      <div class="kr-flow">
        ${s.approach.steps.map(([title, body, tools], i) => `
          <div class="kr-step">
            <div class="kr-num">${String(i+1).padStart(2,'0')}</div>
            <div class="kr-body">
              <h4>${title}</h4>
              <p>${body}</p>
              <div class="kr-tools">${tools.map(t => `<span>${t}</span>`).join('')}</div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="svc-section">
      <div class="svc-h2-lbl">Channel Mix</div>
      <h2 class="svc-h2">Where the budget goes to work</h2>
      <p>The channels that consistently pull the most weight for ${s.short} — prioritised in roughly this order, then rebalanced by what your data says.</p>
      <div class="deliv-list">
        ${s.channels.map(d => `<div class="deliv-item"><div class="chk">✓</div><div class="txt">${d}</div></div>`).join('')}
      </div>
    </div>

    ${related.length ? `
    <div class="svc-section svc-related">
      <div class="svc-h2-lbl">Related Services</div>
      <h2 class="svc-h2">The services doing the heavy lifting</h2>
      <p>These are the engagements that most often anchor ${s.short} work:</p>
      <div class="related-grid">
        ${related.map(k => { const r = SERVICES[k]; return `
          <a class="related-card" href="services.html?s=${k}">
            <span class="related-ico">${r.icon}</span>
            <span class="related-info"><b>${r.title}</b><small>${r.lead.split('. ')[0]}.</small></span>
            <span class="related-go">→</span>
          </a>`; }).join('')}
      </div>
    </div>` : ''}

    <div class="cta-band">
      <div>
        <h3>In ${s.short}? Let's talk specifics.</h3>
        <p>Free 30-minute consultation. Bring your market, leave with a plan built for it.</p>
      </div>
      <a class="btn" href="contact.html">Start a Conversation →</a>
    </div>

    <div class="svc-pager">
      <a class="pager-link" href="industries.html?i=${prevKey}"><small>← Previous Industry</small><span>${INDUSTRIES[prevKey].title}</span></a>
      <a class="pager-link next" href="industries.html?i=${nextKey}"><small>Next Industry →</small><span>${INDUSTRIES[nextKey].title}</span></a>
    </div>
  `;

  window.scrollTo(0, 0);
}

// ─── DARK MODE ─────────────────────────────────────────────────
function toggleDark() {
  const isDark = document.body.classList.toggle('dark');
  document.getElementById('dark-toggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('wjh_dark', isDark ? '1' : '0');
}
if (localStorage.getItem('wjh_dark') === '1') { document.body.classList.add('dark'); document.getElementById('dark-toggle').textContent = '☀️'; }

// ─── MOBILE SUBMENU CARET ──────────────────────────────────────
document.querySelectorAll('.dropdown-caret').forEach(function(btn){
  btn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var li = btn.closest('.has-dropdown');
    if (!li) return;
    var open = li.classList.toggle('submenu-open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
});

// ─── INIT ──────────────────────────────────────────────────────
renderSvcDropdown();
renderIndDropdown();
const params = new URLSearchParams(location.search);
const iKey = params.get('i');
if (iKey && INDUSTRIES[iKey]) renderIndustry(iKey);
else renderHub();

window.addEventListener('popstate', () => {
  const p = new URLSearchParams(location.search);
  const k = p.get('i');
  if (k && INDUSTRIES[k]) renderIndustry(k);
  else renderHub();
});
</script>

<script src="content/published.js"></script>
<script src="content/live.js?v=3"></script>
<script src="content/page-seo.js"></script>
</body>
</html>
